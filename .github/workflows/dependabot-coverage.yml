name: dependabot-coverage

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "29 5 * * 1"
  workflow_dispatch:

permissions: {}

concurrency:
  group: dependabot-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependabot-coverage:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Compare manifests with .github/dependabot.yml
        run: bash .github/scripts/check-dependabot-coverage.sh
